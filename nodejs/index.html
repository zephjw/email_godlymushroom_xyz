<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webmail | godlymushroom.xyz</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.box{max-width:560px;margin:8vh auto;padding:2rem;background:#fff;border:1px solid #dfe5ef;border-radius:16px;box-shadow:0 8px 30px #17203318}h1{margin-top:0}label{display:block;margin:1rem 0 .35rem}input,button{font:inherit;padding:.75rem;border-radius:8px}input{width:100%;box-sizing:border-box;border:1px solid #cfd6e2}button{border:0;background:#6557e8;color:#fff;font-weight:700;cursor:pointer}.hidden{display:none}.error{color:#9b1c1c;background:#ffe5e5;padding:.75rem;border-radius:8px}.muted{color:#667085}.mail{display:block;width:100%;margin:.5rem 0;text-align:left;background:#f8f9ff;color:#172033;border:1px solid #dfe5ef}.toolbar{display:flex;justify-content:space-between;gap:1rem;align-items:center}</style></head><body><main class="box"><section id="login"><h1>Webmail</h1><p class="muted">Secure email for godlymushroom.xyz</p><p id="error" class="error hidden"></p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" required placeholder="you@godlymushroom.xyz"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">Sign in</button></p></form></section><section id="inbox" class="hidden"><div class="toolbar"><h1>Inbox</h1><button id="logout" type="button">Sign out</button></div><p id="status" class="muted"></p><div id="messages"></div></section></main><script>const $=s=>document.querySelector(s);const err=t=>{$('#error').textContent=t;$('#error').classList.remove('hidden')};async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#error').classList.add('hidden');try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});$('#login').classList.add('hidden');$('#inbox').classList.remove('hidden');$('#status').textContent=d.userEmail;const x=await api('/emails?folder=INBOX');$('#messages').innerHTML=x.emails.map(m=>`<button class="mail" type="button"><strong>${String(m.subject||'(no subject)').replace(/[<>]/g,'')}</strong><br><span class="muted">${String(m.from||'').replace(/[<>]/g,'')}</span></button>`).join('')||'<p class="muted">No messages.</p>'}catch(e){err(e.message)}};$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};</script></body></html>
